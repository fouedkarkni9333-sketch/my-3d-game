<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>لعبة المكعب ثلاثية الأبعاد</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: Tahoma, sans-serif; user-select: none; }
        #scoreBoard { position: absolute; top: 15px; width: 100%; text-align: center; color: white; font-size: 22px; font-weight: bold; text-shadow: 2px 2px 4px black; z-index: 10; }
        #gameOverScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; color: white; }
        #gameOverScreen h1 { font-size: 36px; margin-bottom: 10px; text-shadow: 2px 2px 4px black; }
        #restartBtn { padding: 12px 30px; font-size: 20px; font-weight: bold; background: #ff4500; color: white; border: none; border-radius: 25px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .controls { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-around; box-sizing: border-box; z-index: 10; padding: 0 20px; }
        .btn { width: 75px; height: 75px; background: rgba(255, 255, 255, 0.4); border: 2px solid white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; color: white; font-weight: bold; text-shadow: 1px 1px 2px black; touch-action: manipulation; }
        .btn:active { background: rgba(255, 255, 255, 0.8); color: black; }
    </style>
</head>
<body>
    <div id="scoreBoard">النقاط: 0</div>

    <!-- شاشة الخسارة -->
    <div id="gameOverScreen">
        <h1>لقد اصطدمت! 💥</h1>
        <p id="finalScore" style="font-size: 20px; margin-bottom: 20px;">نقاطك: 0</p>
        <button id="restartBtn" onclick="resetGame()">إعادة المحاولة</button>
    </div>

    <!-- أزرار التحكم -->
    <div class="controls">
        <div class="btn" id="btnLeftVisual">◀</div>
        <div class="btn" id="btnJump">▲</div>
        <div class="btn" id="btnRightVisual">▶</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // إضاءة
        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(5, 10, 7);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x606060));

        // الأرضية
        const geometry = new THREE.BoxGeometry(6, 0.5, 50);
        const material = new THREE.MeshStandardMaterial({ color: 0x2e8b57 });
        const platform = new THREE.Mesh(geometry, material);
        platform.position.set(0, -1, -15);
        scene.add(platform);

        // اللاعب
        const playerGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
        const playerMat = new THREE.MeshStandardMaterial({ color: 0xff4500 });
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.set(0, 0, 0);
        scene.add(player);

        // العقبة
        const obsGeo = new THREE.BoxGeometry(1, 1, 1);
        const obsMat = new THREE.MeshStandardMaterial({ color: 0x8B0000 });
        const obstacle = new THREE.Mesh(obsGeo, obsMat);
        obstacle.position.set(0, 0, -30);
        scene.add(obstacle);

        camera.position.set(0, 2.5, 5);
        camera.lookAt(player.position);

        let moveLeft = false, moveRight = false;
        let playerVelocityY = 0;
        let isGrounded = true;
        const gravity = -0.015;
        
        let score = 0;
        let gameSpeed = 0.12;
        let isGameOver = false;

        const setupBtn = (id, onPress, onRelease) => {
            const el = document.getElementById(id);
            if(!el) return;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); onPress(); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); onRelease(); });
            el.addEventListener('mousedown', onPress);
            el.addEventListener('mouseup', onRelease);
        };

        setupBtn('btnLeftVisual', () => moveLeft = true, () => moveLeft = false);
        setupBtn('btnRightVisual', () => moveRight = true, () => moveRight = false);
        setupBtn('btnJump', () => {
            if (isGrounded && !isGameOver) {
                playerVelocityY = 0.25;
                isGrounded = false;
            }
        }, () => {});

        function resetGame() {
            isGameOver = false;
            score = 0;
            gameSpeed = 0.12;
            player.position.set(0, 0, 0);
            obstacle.position.z = -30;
            document.getElementById('scoreBoard').innerText = "النقاط: 0";
            document.getElementById('gameOverScreen').style.display = 'none';
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!isGameOver) {
                if (moveLeft && player.position.x > -2.2) player.position.x -= 0.08;
                if (moveRight && player.position.x < 2.2) player.position.x += 0.08;

                player.position.y += playerVelocityY;
                if (!isGrounded) {
                    playerVelocityY += gravity;
                    if (player.position.y <= 0) {
                        player.position.y = 0;
                        playerVelocityY = 0;
                        isGrounded = true;
                    }
                }

                // حركة العقبة وزيادة السرعة تدريجياً
                obstacle.position.z += gameSpeed;
                if (obstacle.position.z > 4) {
                    obstacle.position.z = -30;
                    score += 10;
                    gameSpeed += 0.005; // زيادة تدريجية في السرعة
                    document.getElementById('scoreBoard').innerText = "النقاط: " + score;
                }

                // فحص الاصطدام بدقة
                if (Math.abs(player.position.z - obstacle.position.z) < 0.8 &&
                    Math.abs(player.position.x - obstacle.position.x) < 0.8 &&
                    player.position.y < 0.6) {
                    isGameOver = true;
                    document.getElementById('finalScore').innerText = "نقاطك النهائية: " + score;
                    document.getElementById('gameOverScreen').style.display = 'flex';
                }

                camera.position.x = player.position.x * 0.4;
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
