<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>لعبة المكعب ثلاثية الأبعاد - تصميم محسّن</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: Tahoma, sans-serif; user-select: none; transition: background 1s ease; }
        #scoreBoard { position: absolute; top: 15px; width: 100%; text-align: center; color: white; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 4px black; z-index: 10; line-height: 1.5; }
        #gameOverScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; color: white; text-align: center; }
        #gameOverScreen h1 { font-size: 36px; margin-bottom: 10px; text-shadow: 2px 2px 4px black; }
        #restartBtn { padding: 12px 30px; font-size: 20px; font-weight: bold; background: #ff4500; color: white; border: none; border-radius: 25px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.4); margin-top: 15px; }
        .controls { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-around; box-sizing: border-box; z-index: 10; padding: 0 20px; direction: ltr; }
        .btn { width: 75px; height: 75px; background: rgba(255, 255, 255, 0.4); border: 2px solid white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; color: white; font-weight: bold; text-shadow: 1px 1px 2px black; touch-action: manipulation; }
        .btn:active { background: rgba(255, 255, 255, 0.8); color: black; }
    </style>
</head>
<body>
    <div id="scoreBoard">
        النقاط: 0<br>
        <span style="font-size: 16px; color: #ffd700;">أعلى نتيجة: <span id="highScoreDisplay">0</span></span>
    </div>

    <!-- شاشة الخسارة -->
    <div id="gameOverScreen">
        <h1>لقد اصطدمت! 💥</h1>
        <p id="finalScore" style="font-size: 18px; margin: 5px;">نقاطك: 0</p>
        <p id="highScoreMsg" style="font-size: 18px; color: #ffd700; margin: 5px 0 15px 0;"></p>
        <button id="restartBtn" onclick="resetGame()">إعادة المحاولة</button>
    </div>

    <!-- أزرار التحكم -->
    <div class="controls">
        <div class="btn" id="btnLeft">◀</div>
        <div class="btn" id="btnJump">▲</div>
        <div class="btn" id="btnRight">▶</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // نظام توليد الأصوات التفاعلي (Web Audio API)
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            initAudio();
            if (!audioCtx) return;

            let osc = audioCtx.createOscillator();
            let gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            let now = audioCtx.currentTime;

            if (type === 'jump') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'crash') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.3);
                gainNode.gain.setValueAtTime(0.5, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        const scene = new THREE.Scene();
        let skyColors = [0x87CEEB, 0xFF7F50, 0x2c3e50, 0x4b0082]; 
        let currentSkyIndex = 0;
        scene.background = new THREE.Color(skyColors[0]);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // إضاءة
        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(5, 10, 7);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x606060));

        // الأرضية
        const geometry = new THREE.BoxGeometry(6, 0.5, 60);
        const material = new THREE.MeshStandardMaterial({ color: 0x2e8b57 });
        const platform = new THREE.Mesh(geometry, material);
        platform.position.set(0, -1, -20);
        scene.add(platform);

        // --- تصميم اللاعب المحسّن (شخصية روبوت ثلاثية الأبعاد) ---
        const player = new THREE.Group();

        // جسم الروبوت
        const bodyGeo = new THREE.BoxGeometry(0.6, 0.7, 0.4);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3498db, metalness: 0.3, roughness: 0.4 });
        const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
        bodyMesh.position.y = 0.35;
        player.add(bodyMesh);

        // رأس الروبوت
        const headGeo = new THREE.BoxGeometry(0.5, 0.4, 0.4);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xf1c40f, metalness: 0.2 });
        const headMesh = new THREE.Mesh(headGeo, headMat);
        headMesh.position.y = 0.85;
        player.add(headMesh);

        // عيون الروبوت (توهج باللون الأحمر/الأبيض)
        const eyeGeo = new THREE.BoxGeometry(0.1, 0.1, 0.05);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        
        const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
        leftEye.position.set(-0.12, 0.88, 0.21);
        player.add(leftEye);

        const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
        rightEye.position.set(0.12, 0.88, 0.21);
        player.add(rightEye);

        // هوائي الروبوت في الأعلى
        const antennaRodGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.2);
        const antennaMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d });
        const antennaRod = new THREE.Mesh(antennaRodGeo, antennaMat);
        antennaRod.position.set(0, 1.15, 0);
        player.add(antennaRod);

        const antennaBallGeo = new THREE.SphereGeometry(0.06, 8, 8);
        const antennaBallMat = new THREE.MeshBasicMaterial({ color: 0xe74c3c });
        const antennaBall = new THREE.Mesh(antennaBallGeo, antennaBallMat);
        antennaBall.position.set(0, 1.28, 0);
        player.add(antennaBall);

        // ضبط موضع مجموعة اللاعب الرئيسية في المشهد
        player.position.set(0, 0, 0);
        scene.add(player);

        camera.position.set(0, 2.5, 5);
        camera.lookAt(player.position);

        let moveLeft = false, moveRight = false;
        let playerVelocityY = 0;
        let isGrounded = true;
        const gravity = -0.015;
        
        let score = 0;
        let gameSpeed = 0.12;
        let isGameOver = false;

        let highScore = localStorage.getItem('threeGameHighScore') || 0;
        document.getElementById('highScoreDisplay').innerText = highScore;

        let obstacles = [];
        const obsGeo = new THREE.BoxGeometry(1, 1, 1);
        const obsMat = new THREE.MeshStandardMaterial({ color: 0x8B0000 });

        function spawnObstacle(zPos) {
            const obstacle = new THREE.Mesh(obsGeo, obsMat);
            const randomX = (Math.random() - 0.5) * 3; 
            obstacle.position.set(randomX, 0, zPos);
            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        spawnObstacle(-25);
        spawnObstacle(-45);
        spawnObstacle(-65);

        const setupBtn = (id, onPress, onRelease) => {
            const el = document.getElementById(id);
            if(!el) return;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); onPress(); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); onRelease(); });
            el.addEventListener('mousedown', onPress);
            el.addEventListener('mouseup', onRelease);
        };

        setupBtn('btnLeft', () => moveLeft = true, () => moveLeft = false);
        setupBtn('btnRight', () => moveRight = true, () => moveRight = false);
        setupBtn('btnJump', () => {
            if (isGrounded && !isGameOver) {
                playerVelocityY = 0.25;
                isGrounded = false;
                playSound('jump');
            }
        }, () => {});

        function updateScoreDisplay() {
            document.getElementById('scoreBoard').innerHTML = 
                `النقاط: ${score}<br><span style="font-size: 16px; color: #ffd700;">أعلى نتيجة: ${highScore}</span>`;
        }

        function resetGame() {
            isGameOver = false;
            score = 0;
            gameSpeed = 0.12;
            currentSkyIndex = 0;
            scene.background.setHex(skyColors[0]);
            player.position.set(0, 0, 0);
            
            obstacles[0].position.set(0, 0, -25);
            obstacles[1].position.set(0, 0, -45);
            obstacles[2].position.set(0, 0, -65);

            updateScoreDisplay();
            document.getElementById('gameOverScreen').style.display = 'none';
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!isGameOver) {
                if (moveLeft && player.position.x > -2.2) player.position.x -= 0.08;
                if (moveRight && player.position.x < 2.2) player.position.x += 0.08;

                player.position.y += playerVelocityY;
                if (!isGrounded) {
                    playerVelocityY += gravity;
                    if (player.position.y <= 0) {
                        player.position.y = 0;
                        playerVelocityY = 0;
                        isGrounded = true;
                    }
                }

                for (let i = 0; i < obstacles.length; i++) {
                    let obs = obstacles[i];
                    obs.position.z += gameSpeed;

                    if (obs.position.z > 4) {
                        obs.position.z = -70;
                        obs.position.x = (Math.random() - 0.5) * 3;
                        score += 5;
                        gameSpeed += 0.002;
                        updateScoreDisplay();

                        let newSkyIndex = Math.floor(score / 30) % skyColors.length;
                        if (newSkyIndex !== currentSkyIndex) {
                            currentSkyIndex = newSkyIndex;
                            scene.background.setHex(skyColors[currentSkyIndex]);
                        }
                    }

                    // فحص الاصطدام (باستخدام موقع إحداثيات مجموعة الروبوت)
                    if (Math.abs(player.position.z - obs.position.z) < 0.8 &&
                        Math.abs(player.position.x - obs.position.x) < 0.8 &&
                        player.position.y < 0.6) {
                        isGameOver = true;
                        playSound('crash');

                        let isNewHighScore = false;
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem('threeGameHighScore', highScore);
                            isNewHighScore = true;
                        }

                        document.getElementById('finalScore').innerText = "نقاطك النهائية: " + score;
                        document.getElementById('highScoreMsg').innerText = isNewHighScore ? "🎉 رقم قياسي جديد!" : "أعلى نتيجة: " + highScore;
                        document.getElementById('gameOverScreen').style.display = 'flex';
                        document.getElementById('highScoreDisplay').innerText = highScore;
                    }
                }

                camera.position.x = player.position.x * 0.4;
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
