<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>لعبة ثلاثية الأبعاد مع عقبات</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: Tahoma, sans-serif; user-select: none; }
        #info { position: absolute; top: 10px; width: 100%; text-align: center; color: white; font-size: 18px; text-shadow: 1px 1px 3px black; z-index: 10; }
        .controls { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-around; box-sizing: border-box; z-index: 10; padding: 0 20px; }
        .btn { width: 70px; height: 70px; background: rgba(255, 255, 255, 0.4); border: 2px solid white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; color: white; font-weight: bold; text-shadow: 1px 1px 2px black; touch-action: manipulation; }
        .btn:active { background: rgba(255, 255, 255, 0.8); color: black; }
    </style>
</head>
<body>
    <div id="info">قفز فوق العقبات بحذر!</div>

    <!-- أزرار التحكم مرتبة: يسار، قفز، يمين -->
    <div class="controls">
        <div class="btn" id="btnLeft">◀</div>
        <div class="btn" id="btnJump">▲</div>
        <div class="btn" id="btnRight">▶</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // إضاءة
        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(5, 10, 7);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x606060));

        // الأرضية
        const geometry = new THREE.BoxGeometry(6, 0.5, 50);
        const material = new THREE.MeshStandardMaterial({ color: 0x2e8b57 });
        const platform = new THREE.Mesh(geometry, material);
        platform.position.set(0, -1, -15);
        scene.add(platform);

        // اللاعب
        const playerGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
        const playerMat = new THREE.MeshStandardMaterial({ color: 0xff4500 });
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.set(0, 0, 0);
        scene.add(player);

        // عقبة متحركة واضحة
        const obsGeo = new THREE.BoxGeometry(1, 1, 1);
        const obsMat = new THREE.MeshStandardMaterial({ color: 0x8B0000 });
        const obstacle = new THREE.Mesh(obsGeo, obsMat);
        obstacle.position.set(0, 0, -25);
        scene.add(obstacle);

        camera.position.set(0, 2.5, 5);
        camera.lookAt(player.position);

        let moveLeft = false, moveRight = false;
        let playerVelocityY = 0;
        let isGrounded = true;
        const gravity = -0.015;

        const setupBtn = (id, onPress, onRelease) => {
            const el = document.getElementById(id);
            if(!el) return;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); onPress(); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); onRelease(); });
            el.addEventListener('mousedown', onPress);
            el.addEventListener('mouseup', onRelease);
        };

        // ربط الاتجاهات الصحيحة للأزرار
        setupBtn('btnLeft', () => moveLeft = true, () => moveLeft = false);
        setupBtn('btnRight', () => moveRight = true, () => moveRight = false);
        setupBtn('btnJump', () => {
            if (isGrounded) {
                playerVelocityY = 0.25;
                isGrounded = false;
            }
        }, () => {});

        function animate() {
            requestAnimationFrame(animate);

            // حركة اللاعب (اليمين يحرك يمين واليسار يحرك يسار)
            if (moveLeft && player.position.x > -2.2) player.position.x -= 0.08;
            if (moveRight && player.position.x < 2.2) player.position.x += 0.08;

            // فيزياء القفز
            player.position.y += playerVelocityY;
            if (!isGrounded) {
                playerVelocityY += gravity;
                if (player.position.y <= 0) {
                    player.position.y = 0;
                    playerVelocityY = 0;
                    isGrounded = true;
                }
            }

            // حركة العقبة نحو المكعب
            obstacle.position.z += 0.12;
            if (obstacle.position.z > 4) {
                obstacle.position.z = -30; // إعادة العقبة للخلف
            }

            camera.position.x = player.position.x * 0.4;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
