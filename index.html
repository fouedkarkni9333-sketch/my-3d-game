<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>لعبة الواقع الافتراضي ثلاثية الأبعاد</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: Tahoma, sans-serif; user-select: none; }
        #scoreBoard { position: absolute; top: 15px; width: 100%; text-align: center; color: white; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 4px black; z-index: 10; line-height: 1.5; }
        #gameOverScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; color: white; text-align: center; }
        #gameOverScreen h1 { font-size: 36px; margin-bottom: 10px; text-shadow: 2px 2px 4px black; }
        #restartBtn { padding: 12px 30px; font-size: 20px; font-weight: bold; background: #ff4500; color: white; border: none; border-radius: 25px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.4); margin-top: 15px; }
        .controls { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-around; box-sizing: border-box; z-index: 10; padding: 0 20px; direction: ltr; }
        .btn { width: 75px; height: 75px; background: rgba(255, 255, 255, 0.3); border: 2px solid white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; color: white; font-weight: bold; text-shadow: 1px 1px 2px black; touch-action: manipulation; backdrop-filter: blur(5px); }
        .btn:active { background: rgba(255, 255, 255, 0.7); color: black; }
    </style>
</head>
<body>
    <div id="scoreBoard">
        النقاط: 0<br>
        <span style="font-size: 16px; color: #ffd700;">أعلى نتيجة: <span id="highScoreDisplay">0</span></span>
    </div>

    <!-- شاشة الخسارة -->
    <div id="gameOverScreen">
        <h1>لقد اصطدمت! 💥</h1>
        <p id="finalScore" style="font-size: 18px; margin: 5px;">نقاطك: 0</p>
        <p id="highScoreMsg" style="font-size: 18px; color: #ffd700; margin: 5px 0 15px 0;"></p>
        <button id="restartBtn" onclick="resetGame()">إعادة المحاولة</button>
    </div>

    <!-- أزرار التحكم -->
    <div class="controls">
        <div class="btn" id="btnLeft">◀</div>
        <div class="btn" id="btnJump">▲</div>
        <div class="btn" id="btnRight">▶</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // نظام توليد الأصوات التفاعلي (Web Audio API)
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            initAudio();
            if (!audioCtx) return;

            let osc = audioCtx.createOscillator();
            let gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            let now = audioCtx.currentTime;

            if (type === 'jump') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(450, now + 0.18);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
                osc.start(now);
                osc.stop(now + 0.18);
            } else if (type === 'crash') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(30, now + 0.35);
                gainNode.gain.setValueAtTime(0.5, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            } else if (type === 'collect') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(350, now);
                osc.frequency.exponentialRampToValueAtTime(900, now + 0.12);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'boost') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(660, now + 0.25);
                gainNode.gain.setValueAtTime(0.4, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        const scene = new THREE.Scene();
        let skyColor = 0x87CEEB;
        scene.background = new THREE.Color(skyColor);
        // إضافة ضباب واقعي في الأفق لإعطاء عمق للمشهد
        scene.fog = new THREE.FogExp2(skyColor, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // تفعيل الظلال الواقعية
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- إضاءة واقعية متقدمة ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffaf0, 1.2);
        sunLight.position.set(10, 20, 10);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 50;
        sunLight.shadow.camera.left = -10;
        sunLight.shadow.camera.right = 10;
        sunLight.shadow.camera.top = 10;
        sunLight.shadow.camera.bottom = -10;
        scene.add(sunLight);

        // --- الأرضية الواقعية (ممر إسفلتي/طبيعي مع جانب عشبية) ---
        const groundGeo = new THREE.BoxGeometry(6, 0.5, 100);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 }); // لون إسفلتي واقعي
        const platform = new THREE.Mesh(groundGeo, groundMat);
        platform.position.set(0, -1, -30);
        platform.receiveShadow = true;
        scene.add(platform);

        // --- تصميم الشخصية (روبوت بتفاصيل وظلال واقعية) ---
        const player = new THREE.Group();

        const bodyGeo = new THREE.BoxGeometry(0.6, 0.7, 0.4);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2980b9, metalness: 0.5, roughness: 0.3 });
        const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
        bodyMesh.position.y = 0.35;
        bodyMesh.castShadow = true;
        player.add(bodyMesh);

        const headGeo = new THREE.BoxGeometry(0.5, 0.4, 0.4);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xf1c40f, metalness: 0.3, roughness: 0.2 });
        const headMesh = new THREE.Mesh(headGeo, headMat);
        headMesh.position.y = 0.85;
        headMesh.castShadow = true;
        player.add(headMesh);

        const eyeGeo = new THREE.BoxGeometry(0.1, 0.1, 0.05);
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c, emissive: 0xff0000 });
        
        const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
        leftEye.position.set(-0.12, 0.88, 0.21);
        player.add(leftEye);

        const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
        rightEye.position.set(0.12, 0.88, 0.21);
        player.add(rightEye);

        player.position.set(0, 0, 0);
        scene.add(player);

        camera.position.set(0, 2.2, 4.5);
        camera.lookAt(player.position);

        let moveLeft = false, moveRight = false;
        let playerVelocityY = 0;
        let isGrounded = true;
        const gravity = -0.018;
        
        let score = 0;
        let baseGameSpeed = 0.12;
        let gameSpeed = baseGameSpeed;
        let isGameOver = false;
        let boostTimer = 0;
        let animationTime = 0;

        let highScore = localStorage.getItem('threeGameHighScore') || 0;
        document.getElementById('highScoreDisplay').innerText = highScore;

        // --- العوائق الواقعية والمتنوعة ---
        let obstacles = [];
        const obsGeos = [
            new THREE.BoxGeometry(1, 1, 1),           
            new THREE.SphereGeometry(0.6, 16, 16),     
            new THREE.ConeGeometry(0.6, 1.2, 6)      
        ];
        const obsMat = new THREE.MeshStandardMaterial({ color: 0xc0392b, metalness: 0.4, roughness: 0.3 });

        function spawnObstacle(zPos) {
            const randomGeo = obsGeos[Math.floor(Math.random() * obsGeos.length)];
            const obstacle = new THREE.Mesh(randomGeo, obsMat);
            const randomX = (Math.random() - 0.5) * 3; 
            obstacle.position.set(randomX, 0, zPos);
            obstacle.castShadow = true;
            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        spawnObstacle(-25);
        spawnObstacle(-45);
        spawnObstacle(-65);

        // --- العناصر المساعدة براقة وواقعية ---
        let collectibles = [];
        const starGeo = new THREE.OctahedronGeometry(0.4);
        const starMat = new THREE.MeshStandardMaterial({ color: 0xf1c40f, metalness: 0.8, roughness: 0.1, emissive: 0x332200 }); 

        const boostGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.6, 12);
        const boostMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, metalness: 0.5, roughness: 0.1, emissive: 0x004444 }); 

        function spawnCollectible(zPos) {
            const isBoost = Math.random() > 0.7; 
            const item = new THREE.Mesh(isBoost ? boostGeo : starGeo, isBoost ? boostMat : starMat);
            item.userData = { type: isBoost ? 'boost' : 'star' };
            const randomX = (Math.random() - 0.5) * 3;
            item.position.set(randomX, 0.5, zPos);
            item.castShadow = true;
            scene.add(item);
            collectibles.push(item);
        }

        spawnCollectible(-35);
        spawnCollectible(-55);

        const setupBtn = (id, onPress, onRelease) => {
            const el = document.getElementById(id);
            if(!el) return;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); onPress(); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); onRelease(); });
            el.addEventListener('mousedown', onPress);
            el.addEventListener('mouseup', onRelease);
        };

        setupBtn('btnLeft', () => moveLeft = true, () => moveLeft = false);
        setupBtn('btnRight', () => moveRight = true, () => moveRight = false);
        setupBtn('btnJump', () => {
            if (isGrounded && !isGameOver) {
                playerVelocityY = 0.32;
                isGrounded = false;
                playSound('jump');
            }
        }, () => {});

        function updateScoreDisplay() {
            let speedStatus = boostTimer > 0 ? " | ⚡ سرعة فائقة!" : "";
            document.getElementById('scoreBoard').innerHTML = 
                `النقاط: ${score}${speedStatus}<br><span style="font-size: 16px; color: #ffd700;">أعلى نتيجة: ${highScore}</span>`;
        }

        function resetGame() {
            isGameOver = false;
            score = 0;
            baseGameSpeed = 0.12;
            gameSpeed = baseGameSpeed;
            boostTimer = 0;
            player.position.set(0, 0, 0);
            player.rotation.z = 0;
            
            obstacles[0].position.set(0, 0, -25);
            obstacles[1].position.set(0, 0, -45);
            obstacles[2].position.set(0, 0, -65);

            collectibles[0].position.set(0, 0.5, -35);
            collectibles[1].position.set(0, 0.5, -55);

            updateScoreDisplay();
            document.getElementById('gameOverScreen').style.display = 'none';
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!isGameOver) {
                animationTime += 0.15;

                if (boostTimer > 0) {
                    boostTimer--;
                    gameSpeed = baseGameSpeed * 1.8;
                    if (boostTimer === 0) {
                        gameSpeed = baseGameSpeed;
                        updateScoreDisplay();
                    }
                }

                if (moveLeft && player.position.x > -2.2) {
                    player.position.x -= 0.09;
                    if (player.rotation.z < 0.3) player.rotation.z += 0.05;
                } else if (moveRight && player.position.x < 2.2) {
                    player.position.x += 0.09;
                    if (player.rotation.z > -0.3) player.rotation.z -= 0.05;
                } else {
                    player.rotation.z *= 0.8;
                }

                player.position.y += playerVelocityY;
                if (!isGrounded) {
                    playerVelocityY += gravity;
                    player.rotation.x += 0.04;
                    if (player.position.y <= 0) {
                        player.position.y = 0;
                        playerVelocityY = 0;
                        isGrounded = true;
                        player.rotation.x = 0;
                    }
                } else {
                    bodyMesh.position.y = 0.35 + Math.sin(animationTime * 2) * 0.05;
                    headMesh.position.y = 0.85 + Math.cos(animationTime * 2) * 0.03;
                }

                for (let i = 0; i < obstacles.length; i++) {
                    let obs = obstacles[i];
                    obs.position.z += gameSpeed;
                    obs.rotation.x += 0.02;
                    obs.rotation.y += 0.03;

                    if (obs.position.z > 4) {
                        obs.position.z = -70;
                        obs.position.x = (Math.random() - 0.5) * 3;
                        score += 5;
                        baseGameSpeed += 0.001;
                        if (boostTimer === 0) gameSpeed = baseGameSpeed;
                        updateScoreDisplay();
                    }

                    if (Math.abs(player.position.z - obs.position.z) < 0.8 &&
                        Math.abs(player.position.x - obs.position.x) < 0.8 &&
                        player.position.y < 0.6) {
                        isGameOver = true;
                        playSound('crash');

                        let isNewHighScore = false;
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem('threeGameHighScore', highScore);
                            isNewHighScore = true;
                        }

                        document.getElementById('finalScore').innerText = "نقاطك النهائية: " + score;
                        document.getElementById('highScoreMsg').innerText = isNewHighScore ? "🎉 رقم قياسي جديد!" : "أعلى نتيجة: " + highScore;
                        document.getElementById('gameOverScreen').style.display = 'flex';
                        document.getElementById('highScoreDisplay').innerText = highScore;
                    }
                }

                for (let j = 0; j < collectibles.length; j++) {
                    let item = collectibles[j];
                    item.position.z += gameSpeed;
                    item.rotation.y += 0.07;
                    item.rotation.z += 0.04;

                    if (item.position.z > 4) {
                        item.position.z = -60;
                        item.position.x = (Math.random() - 0.5) * 3;
                    }

                    if (Math.abs(player.position.z - item.position.z) < 0.8 &&
                        Math.abs(player.position.x - item.position.x) < 0.8 &&
                        player.position.y < 1.0) {
                        
                        if (item.userData.type === 'star') {
                            score += 15;
                            playSound('collect');
                        } else if (item.userData.type === 'boost') {
                            boostTimer = 180; 
                            playSound('boost');
                        }
                        updateScoreDisplay();

                        item.position.z = -60;
                        item.position.x = (Math.random() - 0.5) * 3;
                    }
                }

                camera.position.x = player.position.x * 0.4;
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
